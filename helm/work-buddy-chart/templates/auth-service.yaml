{{- if .Values.authService.enabled -}}
# templates/auth-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "work-buddy-chart.fullname" . }}-auth-service
  labels:
    {{- include "work-buddy-chart.labels" . | nindent 8 }}
    app.kubernetes.io/component: auth-service
spec:
  replicas: {{ .Values.replicaCount }} # Use global replicaCount for now, can be service specific
  selector:
    matchLabels:
      {{- include "work-buddy-chart.selectorLabels" . | nindent 10 }}
      app.kubernetes.io/component: auth-service
  template:
    metadata:
      labels:
        {{- include "work-buddy-chart.selectorLabels" . | nindent 12 }}
        app.kubernetes.io/component: auth-service
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 10 }}
      {{- end }}
      containers:
      - name: auth-service
        image: "{{ .Values.authService.image.repository }}:{{ .Values.authService.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.authService.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.authService.port }}
          protocol: TCP
        env:
        - name: FLASK_APP
          value: "app.py"
        - name: FLASK_ENV
          value: "production"
        - name: GOOGLE_CLIENT_ID
          value: {{ .Values.authService.config.googleClientId | quote }}
        - name: GOOGLE_CLIENT_SECRET # Should come from a K8s secret in prod
          value: {{ .Values.authService.secrets.googleClientSecret | quote }}
        - name: GOOGLE_REDIRECT_URI
          value: {{ .Values.authService.config.googleRedirectUri | quote }}
        - name: SECRET_KEY # Should come from a K8s secret in prod
          value: {{ .Values.authService.secrets.flaskSecretKey | quote }}
        - name: NEO4J_URI
          value: {{ .Values.authService.config.neo4jUri | default .Values.global.neo4j.uri | quote }}
        - name: NEO4J_USER
          value: {{ .Values.authService.config.neo4jUser | default .Values.global.neo4j.user | quote }}
        - name: NEO4J_PASSWORD # Should come from a K8s secret in prod
          value: {{ .Values.authService.secrets.neo4jPassword | quote }}
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "work-buddy-chart.fullname" . }}-auth-service
  labels:
    {{- include "work-buddy-chart.labels" . | nindent 8 }}
    app.kubernetes.io/component: auth-service
spec:
  type: {{ .Values.authService.service.type }}
  ports:
  - port: {{ .Values.authService.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "work-buddy-chart.selectorLabels" . | nindent 8 }}
    app.kubernetes.io/component: auth-service
# ConfigMap and Secret resources are usually managed outside the main service template,
# or created conditionally. For this example, we assume values are injected directly for simplicity
# or that Kubernetes Secrets (e.g., 'auth-service-secrets-k8s') are created manually
# and mounted as env vars or files if a more secure approach is used in template.
{{- end }}
